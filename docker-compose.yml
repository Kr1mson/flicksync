services:
  app:
    build: .
    container_name: flicksync_app
    ports:
      - "5000:5000"
    volumes:
      - ./embeddings:/app/embeddings
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s